<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Exact AT monogram: zinc #27272A + amber #F59E0B, transparent bg -->
  <g stroke-linecap="round" stroke-linejoin="miter">
    <!-- A left leg -->
    <path d="M156 388 L256 108" stroke="#27272A" stroke-width="26"/>
    <!-- Shared stem (A right + T) -->
    <path d="M256 108 L256 388" stroke="#27272A" stroke-width="26"/>
